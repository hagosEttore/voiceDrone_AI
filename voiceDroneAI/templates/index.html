<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Drone AI - Main Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1b5e20;
            --primary-green-light: #2e7d32;
            --primary-green-lighter: #43a047;
            --accent-green: #66bb6a;
            --background: #f1f8f6;
            --surface: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #757575;
            --border: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-green-light) 100%);
            color: white;
            padding: 40px 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 0.95rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .content {
            padding: 32px 24px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 20px;
            background: var(--background);
            border: 2px solid var(--border);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-weight: 500;
        }

        .menu-item:hover {
            background: linear-gradient(135deg, rgba(27, 94, 32, 0.1) 0%, rgba(46, 125, 50, 0.1) 100%);
            border-color: var(--primary-green-light);
            transform: translateX(4px);
        }

        .menu-item-icon {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--primary-green-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .menu-item-text {
            flex: 1;
        }

        .menu-item-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .menu-item-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .status-bar {
            background: var(--background);
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #bdbdbd;
        }

        .status-dot.connected {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .content {
                padding: 24px 16px;
            }

            .menu-grid {
                gap: 12px;
            }

            .menu-item {
                padding: 16px;
            }

            .menu-item-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
                margin-right: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Voice Drone AI</h1>
                <p>Control your drone with voice and camera</p>
            </div>

            <div class="content">
                <div class="menu-grid">
                    <a href="/control" class="menu-item">
                        <div class="menu-item-icon">🎮</div>
                        <div class="menu-item-text">
                            <div class="menu-item-title">Control Panel</div>
                            <div class="menu-item-desc">Camera and voice control combined</div>
                        </div>
                    </a>

                    <a href="/settings" class="menu-item">
                        <div class="menu-item-icon">⚙️</div>
                        <div class="menu-item-text">
                            <div class="menu-item-title">Settings</div>
                            <div class="menu-item-desc">Configure drone and system</div>
                        </div>
                    </a>
                </div>
            </div>

            <div class="status-bar">
                <div class="status-item">
                    <span>Drone Status</span>
                    <div id="statusDot" class="status-dot"></div>
                </div>
                <div class="status-item">
                    <span>Battery:</span>
                    <span id="batteryLevel">--</span>%
                </div>
            </div>
        </div>
    </div>

    <script>
        async function updateStatus() {
            try {
                const res = await fetch('/api/state');
                const state = await res.json();
                
                const statusDot = document.getElementById('statusDot');
                const batteryLevel = document.getElementById('batteryLevel');
                
                if (state.connected) {
                    statusDot.classList.add('connected');
                } else {
                    statusDot.classList.remove('connected');
                }
                
                batteryLevel.textContent = state.battery;
            } catch (e) {
                console.error('Error fetching status:', e);
            }
        }

        // Update status on load and every 2 seconds
        updateStatus();
        setInterval(updateStatus, 2000);
    </script>
</body>
</html>
