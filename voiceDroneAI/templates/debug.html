<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Mode - Voice Drone AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1b5e20;
            --primary-green-light: #2e7d32;
            --accent-green: #66bb6a;
            --background: linear-gradient(135deg, #f1f8f6 0%, #e8f5e9 100%);
            --surface: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #757575;
            --border: #e0e0e0;
            --error-color: #d32f2f;
            --gradient-primary: linear-gradient(135deg, #1b5e20 0%, #2e7d32 50%, #4caf50 100%);
            --gradient-card: linear-gradient(135deg, #ffffff 0%, #f1f8f6 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--background);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 0;
        }

        .header {
            background: var(--gradient-primary);
            color: white;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(27, 94, 32, 0.25);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .debug-badge {
            background: rgba(255, 255, 255, 0.3);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main-container {
            display: flex;
            flex: 1;
            gap: 10px;
            padding: 10px;
            max-width: 1300px;
            margin: 0 auto;
            width: 100%;
        }

        .camera-section {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .video-area {
            background: #000;
            border-radius: 8px;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1rem;
            overflow: hidden;
            flex: 1;
            min-height: 350px;
            position: relative;
        }

        .video-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-placeholder {
            text-align: center;
            opacity: 0.6;
        }

        .camera-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
            gap: 8px;
        }

        .control-btn {
            padding: 8px 4px;
            border: none;
            border-radius: 6px;
            background: linear-gradient(135deg, #f5f5f5 0%, #eeeeee 100%);
            color: var(--text-primary);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .control-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(27, 94, 32, 0.15) 0%, rgba(46, 125, 50, 0.15) 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(27, 94, 32, 0.2);
        }

        .control-btn.active {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 4px 16px rgba(27, 94, 32, 0.3);
        }

        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .icon {
            font-size: 16px;
        }

        .control-panel {
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-card {
            background: var(--gradient-card);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(27, 94, 32, 0.12);
            border: 1px solid rgba(102, 187, 106, 0.2);
        }

        .step-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            width: 100%;
        }

        .step-button {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .step-button:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(27, 94, 32, 0.1) 0%, rgba(46, 125, 50, 0.1) 100%);
            border-color: var(--primary-green-light);
            transform: translateY(-2px);
        }

        .step-button.success {
            background: var(--gradient-primary);
            color: white;
            border-color: var(--primary-green);
        }

        .step-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-log {
            width: 100%;
            background: linear-gradient(135deg, rgba(102, 187, 106, 0.1) 0%, rgba(129, 199, 132, 0.1) 100%);
            border: 1px solid rgba(102, 187, 106, 0.3);
            border-radius: 6px;
            padding: 10px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            min-height: 80px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
        }

        .log-entry {
            margin-bottom: 4px;
            padding: 2px 0;
        }

        .log-entry.success {
            color: var(--accent-green);
        }

        .log-entry.error {
            color: var(--error-color);
        }

        .error-message {
            background: linear-gradient(135deg, rgba(211, 47, 47, 0.1) 0%, rgba(192, 0, 0, 0.1) 100%);
            border: 2px solid var(--error-color);
            border-radius: 8px;
            padding: 16px;
            color: var(--error-color);
            text-align: center;
            margin: 20px;
            font-weight: 500;
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                padding: 8px;
            }

            .video-area {
                min-height: 280px;
            }

            .control-panel {
                width: 100%;
            }

            .camera-controls {
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
            }
        }

        @media (max-width: 600px) {
            .header {
                flex-direction: column;
                gap: 8px;
                text-align: center;
                padding: 10px 12px;
            }

            .header h1 {
                font-size: 1.1rem;
            }

            .main-container {
                flex-direction: column;
                padding: 6px;
                gap: 8px;
            }

            .video-area {
                aspect-ratio: 9 / 16;
                min-height: 260px;
            }

            .camera-controls {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }

            .control-btn {
                font-size: 0.65rem;
                padding: 6px 3px;
                gap: 3px;
            }

            .icon {
                font-size: 14px;
            }

            .control-panel {
                width: 100%;
            }

            .panel-card {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>🔧 Debug Mode</h1>
            <span class="debug-badge">Temporary</span>
        </div>
        <a href="/" class="back-btn">← Back</a>
    </div>

    {% if not available %}
    <div class="error-message">
        ⚠️ Camera test modules not available
    </div>
    {% else %}
    <div class="main-container">
        <!-- Left Side - Video Feed -->
        <div class="camera-section">
            <div class="video-area">
                <img id="videoFeed" style="display: none;" alt="Debug Stream">
                <div id="placeholder" class="video-placeholder">
                    <div>Camera Feed (Debug)</div>
                    <div style="font-size: 0.9rem; margin-top: 8px;">Waiting for connection...</div>
                </div>
            </div>

            <div class="camera-controls">
                <button class="control-btn" disabled>
                    <span class="icon">📷</span>
                    <span>Record</span>
                </button>
                <button class="control-btn" disabled>
                    <span class="icon">📸</span>
                    <span>Photo</span>
                </button>
                <button class="control-btn" disabled>
                    <span class="icon">🔄</span>
                    <span>Rotate</span>
                </button>
                <button class="control-btn" disabled>
                    <span class="icon">⚡</span>
                    <span>Focus</span>
                </button>
            </div>
        </div>

        <!-- Right Side - Control Panel -->
        <div class="control-panel">
            <!-- Step 1: WiFi -->
            <div class="panel-card">
                <div class="step-title">1. Network</div>
                <button id="btnWifi" class="step-button" onclick="connectWifi()">Connect Wi-Fi</button>
            </div>

            <!-- Step 2: SDK -->
            <div class="panel-card">
                <div class="step-title">2. Drone</div>
                <button id="btnSdk" class="step-button" onclick="connectSdk()" disabled>Connect SDK</button>
            </div>

            <!-- Step 3: Stream -->
            <div class="panel-card">
                <div class="step-title">3. Stream</div>
                <button id="btnStream" class="step-button" onclick="toggleStream()" disabled>Start Stream</button>
            </div>

            <!-- Status Log -->
            <div class="panel-card">
                <div class="step-title">Status Log</div>
                <div id="statusLog" class="status-log">
                    <div class="log-entry">Ready for connection...</div>
                </div>
            </div>
        </div>
    </div>
    {% endif %}

    <script>
        const videoFeed = document.getElementById('videoFeed');
        const placeholder = document.getElementById('placeholder');
        const statusLog = document.getElementById('statusLog');
        const btnWifi = document.getElementById('btnWifi');
        const btnSdk = document.getElementById('btnSdk');
        const btnStream = document.getElementById('btnStream');

        function log(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            statusLog.appendChild(entry);
            statusLog.scrollTop = statusLog.scrollHeight;
        }

        async function updateStatus() {
            try {
                const res = await fetch('/api/debug/status');
                const data = await res.json();
                
                if (!data.available) return;

                const state = data.state;
                
                // Update button states based on state
                if (state === 'DISCONNECTED') {
                    btnWifi.disabled = false;
                    btnWifi.classList.remove('success');
                    btnSdk.disabled = true;
                    btnSdk.classList.remove('success');
                    btnStream.disabled = true;
                } else if (state === 'WIFI_CONNECTED') {
                    btnWifi.disabled = false;
                    btnWifi.classList.add('success');
                    btnSdk.disabled = false;
                    btnSdk.classList.remove('success');
                    btnStream.disabled = true;
                } else if (state === 'SDK_CONNECTED') {
                    btnWifi.classList.add('success');
                    btnSdk.classList.add('success');
                    btnStream.disabled = false;
                } else if (state === 'STREAMING') {
                    btnWifi.classList.add('success');
                    btnSdk.classList.add('success');
                    btnStream.disabled = false;
                    btnStream.textContent = 'Stop Stream';
                    videoFeed.style.display = 'block';
                    placeholder.style.display = 'none';
                    videoFeed.src = '/debug/video_feed?' + new Date().getTime();
                }
            } catch (e) {
                console.error('Status update error:', e);
            }
        }

        async function connectWifi() {
            log('Connecting to Wi-Fi...', 'info');
            try {
                const res = await fetch('/api/debug/connect_wifi', { method: 'POST' });
                const data = await res.json();
                log(data.message, data.success ? 'success' : 'error');
                updateStatus();
            } catch (e) {
                log('Connection error', 'error');
            }
        }

        async function connectSdk() {
            log('Connecting to SDK...', 'info');
            try {
                const res = await fetch('/api/debug/connect_sdk', { method: 'POST' });
                const data = await res.json();
                log(data.message, data.success ? 'success' : 'error');
                updateStatus();
            } catch (e) {
                log('Connection error', 'error');
            }
        }

        async function toggleStream() {
            const isStreaming = btnStream.textContent === 'Stop Stream';
            log(isStreaming ? 'Stopping stream...' : 'Starting stream...', 'info');
            
            try {
                const endpoint = isStreaming ? '/api/debug/stop_stream' : '/api/debug/start_stream';
                const res = await fetch(endpoint, { method: 'POST' });
                const data = await res.json();
                log(data.message, data.success ? 'success' : 'error');
                
                if (data.success && !isStreaming) {
                    btnStream.textContent = 'Stop Stream';
                } else if (data.success && isStreaming) {
                    btnStream.textContent = 'Start Stream';
                    videoFeed.style.display = 'none';
                    placeholder.style.display = 'block';
                    videoFeed.src = '';
                }
                
                updateStatus();
            } catch (e) {
                log('Stream error', 'error');
            }
        }

        // Initial status and polling
        updateStatus();
        setInterval(updateStatus, 1000);
    </script>
</body>
</html>
